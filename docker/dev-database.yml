services:
  postgres:
    image: postgres:15-alpine
    container_name: rumantra-database
    environment:
      POSTGRES_DB: rumantra-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
#    healthcheck:
#      test: ["CMD-SHELL", "pg_isready -U postgres"]
#      interval: 5s
#      timeout: 5s
#      retries: 5

volumes:
  postgres-data:
    driver: local
