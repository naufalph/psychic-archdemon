<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Rumantra</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f4f5; min-height: 100vh;">
      <tr>
        <td align="center" style="padding: 40px 16px;">
          <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">

            <!-- Logo -->
            <tr>
              <td style="background-color: #ffffff; padding: 28px 40px 0 40px;">
                <div style="font-size: 22px; font-weight: 900; color: #0a0a0a; letter-spacing: -1px; line-height: 1;">
                  Rumantra<span style="color: #185c93;">.</span>
                </div>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="background-color: #ffffff; padding: 20px 40px 0 40px;">
                <div style="height: 1px; background-color: #e4e4e7;"></div>
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="background-color: #ffffff; padding: 32px 40px 40px 40px;">
                {{CONTENT}}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="background-color: #fafafa; padding: 20px 40px; text-align: center; border-top: 1px solid #e4e4e7;">
                <p style="color: #71717a; font-size: 12px; margin: 0 0 4px 0;">
                  &copy; 2026 Rumantra. All rights reserved.
                </p>
                <p style="color: #a1a1aa; font-size: 11px; margin: 0;">
                  This is an automated message. Please do not reply to this email.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
