# Local Development Environment Properties

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/architecture_marketplace
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# JPA/Hibernate Local Development Configuration
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=DEBUG
logging.level.com.rumantra=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Security Configuration
jwt.secret=local-development-secret-key-must-be-long-and-complex
jwt.expiration=86400000

# Flyway Migration Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Enable H2 Console for Local Development (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring Boot DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.generate-ddl=true
