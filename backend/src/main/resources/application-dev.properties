# Development Environment Properties

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/architecture_marketplace
spring.datasource.username=dev_user
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Development Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.architecturemarketplace=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Security Configuration
jwt.secret=${JWT_DEV_SECRET}
jwt.expiration=86400000

# Flyway Migration Configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# OpenAPI/Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
