# Remote access via Tailscale configuration
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=remote
# Or set environment variable: export SPRING_PROFILES_ACTIVE=remote

# OAuth2 Redirect URIs for Tailscale access
spring.security.oauth2.client.registration.google.redirect-uri=http://aexther-lens.tailfeca57.ts.net:8080/rmtr/users/oauth2/callback/google
spring.security.oauth2.client.registration.linkedin.redirect-uri=http://aexther-lens.tailfeca57.ts.net:8080/rmtr/users/oauth2/callback/linkedin

# Frontend URL for email verification and OAuth redirects
app.frontend.url=http://aexther-lens.tailfeca57.ts.net:3001

# File Storage Base URL for Tailscale access
file.storage.local.base-url=http://aexther-lens.tailfeca57.ts.net:8080/uploads

# Application Base URL for Xendit callbacks (use public URL if available)
app.base-url=http://aexther-lens.tailfeca57.ts.net:8080
