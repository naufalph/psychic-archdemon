# Server Configuration
server.port=8080
server.address=0.0.0.0

# Application Name
spring.application.name=rumantra

# Datasource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rumantra-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Default Profile
#spring.profiles.active=local

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.rumantra=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Flyway Migration Configuration
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Security Configuration
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# File Storage Configuration
# Options: local (development) or cloudinary (production)
file.storage.type=local

# Local File Storage (for development)
file.storage.local.path=uploads
file.storage.local.base-url=http://localhost:8080/uploads

# Cloudinary Storage (for production - uncomment and configure when needed)
# file.storage.type=cloudinary
# file.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
# file.storage.cloudinary.api-key=${CLOUDINARY_API_KEY}
# file.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Swagger/OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Enable Profile-Specific Properties
#spring.profiles.include=local
# spring.profiles.include=dev

# Actuator Configuration
#management.endpoints.web.exposure.include=health,info,metrics,prometheus
#management.endpoint.health.show-details=always
#management.endpoint.health.show-components=always
#management.metrics.export.prometheus.enabled=true

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/rmtr/users/oauth2/callback/google}

# LinkedIn OAuth2 Configuration
spring.security.oauth2.client.registration.linkedin.client-id=${LINKEDIN_CLIENT_ID}
spring.security.oauth2.client.registration.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.linkedin.redirect-uri=${LINKEDIN_REDIRECT_URI:http://localhost:8080/rmtr/users/oauth2/callback/linkedin}
spring.security.oauth2.client.registration.linkedin.scope=profile,email
spring.security.oauth2.client.registration.linkedin.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.linkedin.authorization-uri=https://www.linkedin.com/oauth/v2/authorization
spring.security.oauth2.client.provider.linkedin.token-uri=https://www.linkedin.com/oauth/v2/accessToken
spring.security.oauth2.client.provider.linkedin.user-info-uri=https://api.linkedin.com/v2/emailAddress?q=members&projection=(elements*(handle~))
spring.security.oauth2.client.provider.linkedin.user-name-attribute=id

# Email Configuration - Custom Domain
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${EMAIL_HOST}

# Frontend URL for email verification links
app.frontend.url=${FRONTEND_URL:http://localhost:3001}

# Application Base URL (for Xendit callbacks)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Xendit Payment Gateway Configuration
xendit.api-key=${XENDIT_API_KEY:xnd_development_test_key_placeholder}
xendit.webhook-token=${XENDIT_WEBHOOK_TOKEN:test_webhook_token_placeholder}