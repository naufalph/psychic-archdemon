<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Building illustration -->
  <g transform="translate(300, 150)">
    <rect x="0" y="100" width="80" height="120" fill="#3b82f6" opacity="0.8"/>
    <rect x="90" y="80" width="60" height="140" fill="#1e40af" opacity="0.9"/>
    <rect x="160" y="60" width="90" height="160" fill="#3b82f6" opacity="0.8"/>

    <!-- Windows -->
    <rect x="10" y="110" width="12" height="12" fill="white"/>
    <rect x="30" y="110" width="12" height="12" fill="white"/>
    <rect x="50" y="110" width="12" height="12" fill="white"/>

    <rect x="100" y="90" width="10" height="10" fill="white"/>
    <rect x="120" y="90" width="10" height="10" fill="white"/>
    <rect x="100" y="110" width="10" height="10" fill="white"/>
    <rect x="120" y="110" width="10" height="10" fill="white"/>

    <rect x="175" y="75" width="15" height="15" fill="white"/>
    <rect x="200" y="75" width="15" height="15" fill="white"/>
    <rect x="225" y="75" width="15" height="15" fill="white"/>
  </g>

  <!-- Overlay text -->
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#64748b">
    Architecture Placeholder
  </text>
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">
    Replace with high-resolution image
  </text>
</svg>